name: CyberLabX CI

# Runs on every push and pull request targeting main.
# You can add other branches later if you start using feature branches.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ---------------------------------
  # Job 1: Lint the Python code
  # ---------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: pip install flake8

      - name: Run flake8
        run: |
          # E9,F63,F7,F82 = syntax errors / undefined names — always fail on these.
          # Everything else is reported but won't fail the build (kept lenient for now).
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ---------------------------------
  # Job 2: Trivy scans on the lab images
  # ---------------------------------
  trivy-scan:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        image:
          - vulnerables/web-dvwa
          - bkimminich/juice-shop

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # set to "1" later if you want the build to fail on findings